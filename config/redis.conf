# config/redis.conf
# Zelvryn — Redis profile store configuration
# Usage: redis-server config/redis.conf
# Override individual keys via: redis-server config/redis.conf --port 6380

# ── Network ──────────────────────────────────────────────────────────────────
bind 127.0.0.1
port 6379
timeout 300
tcp-keepalive 60

# ── General ───────────────────────────────────────────────────────────────────
daemonize no
loglevel notice
logfile ""
databases 1

# ── Memory ────────────────────────────────────────────────────────────────────
# Limit to 512 MB. With ~1 KB per profile, this holds ~500 000 profiles.
maxmemory 512mb
# Evict least-recently-used keys when limit is reached.
# Profiles are re-created from population prior on eviction, so LRU is safe.
maxmemory-policy allkeys-lru

# ── Persistence — AOF (Append-Only File) ──────────────────────────────────────
# AOF ensures no profile is lost on Redis restart.
# RDB snapshots are disabled to reduce write amplification.
appendonly yes
appendfilename "zelvryn.aof"
appenddirname "/data"
# fsync every second — good balance of durability vs performance
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── RDB (disable) ─────────────────────────────────────────────────────────────
save ""

# ── Slow log ──────────────────────────────────────────────────────────────────
# Log queries taking longer than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Client limits ─────────────────────────────────────────────────────────────
maxclients 256

# ── Lazy freeing ─────────────────────────────────────────────────────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ── Security ──────────────────────────────────────────────────────────────────
# Uncomment and set a strong password in production:
# requirepass your-strong-redis-password-here
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""