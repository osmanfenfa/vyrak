# zelvryn/db/migrations/alembic.ini
# ===================================
# Alembic configuration for the Zelvryn ABSA database.
#
# Usage:
#   cd db/migrations
#   alembic upgrade head          # Apply all pending migrations
#   alembic downgrade -1          # Roll back the latest migration
#   alembic current               # Show current migration state
#   alembic history --verbose     # Show full migration history
#   alembic revision --autogenerate -m "description"  # Generate new migration
#   alembic upgrade head --sql    # Generate SQL without applying (offline mode)
#
# The DATABASE_URL environment variable overrides sqlalchemy.url in env.py.
# Always set DATABASE_URL in your deployment environment rather than
# hardcoding credentials here.
#
# Author : Vyrak
# System : Zelvryn — Adaptive Behavioral Signature Authentication

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = .

# Path template for new revision files.
# %(rev)s  = short revision identifier (e.g., a1b2c3d4)
# %(slug)s = slugified version of the -m message
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database connection string.
# In production: override via DATABASE_URL environment variable (set in env.py).
# Format: postgresql+psycopg2://user:password@host:5432/database
# NOTE: This is a synchronous psycopg2 URL — Alembic runs migrations synchronously.
# The running API uses the asyncpg variant (set via REDIS_URL env var).
sqlalchemy.url = postgresql+psycopg2://zelvryn:zelvryn@localhost:5432/zelvryn

# Timezone for generated migration timestamps.
timezone = UTC

# Truncate long revision identifiers in branch labels to this length.
# Default 40; shorter is more readable in filenames.
truncate_slug_length = 60

# Revision identifiers for the default branch.
# Leave empty for a simple linear history.
revision_environment = false

# If set to 'true', revision scripts generate from the current model state
# including previously applied revisions (useful for out-of-order branches).
sourceless = false

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level    = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level     = WARNING
handlers  =
qualname  = sqlalchemy.engine
# Set to INFO to see all SQL statements executed during migrations.
# Set to WARNING in production to reduce log noise.

[logger_alembic]
level     = INFO
handlers  =
qualname  = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format    = %(levelname)-5.5s [%(name)s] %(message)s
datefmt   = %H:%M:%S
